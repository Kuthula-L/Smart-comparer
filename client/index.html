<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Card</title>
  </head>
  <body>
    <div
      class="add-button-component"
      style="position: absolute; left: 50px; top: 50px"
    >
      <div
        class="box"
        style="
          width: 225px;
          height: 307px;
          background: white;
          border-style: solid;
          border-color: #d18286;
          border-radius: 20px;
        "
      ></div>
      <div
        class="box2"
        style="
          position: absolute;
          width: 205px;
          height: 195px;
          left: 15px;
          top: 20px;
          border-radius: 10px;
          background: pink;
        "
      ></div>
      <div
        class="Product-name"
        src="product-name"
        style="
          position: absolute;
          left: 15px;
          top: 225px;
          font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        "
      >
        Product Name
      </div>
      <div
        class="Product-price"
        src="product-price"
        style="
          position: absolute;
          left: 15px;
          top: 245px;
          font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
          font-size: 12px;
        "
      >
        Price -
      </div>
      <div
        class="Product-sale-price"
        src="product-sale-price"
        style="
          position: absolute;
          left: 15px;
          top: 265px;
          font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
          font-size: 12px;
        "
      >
        Sale -
      </div>
      <div
        class="box3"
        style="
          position: absolute;
          width: 90px;
          height: 75px;
          background: white;
          left: 135px;
          top: 235px;
          border-style: solid;
          border-color: #d18286;
          border-radius: 20px;
          border-bottom-color: white;
          border-right-color: white;
          border-bottom-left-radius: 5px;
          border-top-right-radius: 5px;
        "
      ></div>
      <button
        class="add-button"
        style="
          position: absolute;
          left: 150px;
          top: 245px;
          width: 70px;
          height: 70px;
          font-size: 36px;
          background: black;
          border-bottom-right-radius: 30px;
          border-top-left-radius: 30px;
          border-top-right-radius: 30px;
          border-bottom-left-radius: 5px;
          color: white;
          border: none;
          cursor: pointer;
          padding: 0;
          display: flex;
          align-items: center;
          justify-content: center;
        "
      >
        +
      </button>
      <div
        class="box5"
        style="
          position: absolute;
          width: 35px;
          height: 35px;
          top: 20px;
          left: 15px;
          border-bottom-right-radius: 35px;
          background: white;
        "
      ></div>
      <div
        class="product-image"
        style="
          width: 95px;
          height: 95px;
          position: absolute;
          left: 73px;
          top: 75px;
        "
      >
        <img
          data-src="product-image.jpg"
          alt="Product image"
          class="product-img"
          style="max-width: 100%; max-height: 100%"
        />
      </div>
      <button
        class="heart-button"
        style="
          position: absolute;
          background: none;
          border: none;
          cursor: pointer;
          padding: 0;
          width: 25px;
          height: 25px;
          top: 55px;
          left: 170px;
        "
      >
        <img
          src="heart-angle-svgrepo-com.svg"
          alt="heart"
          style="width: 100%; height: 100%; border-color: white"
        />
      </button>
      <div
        class="logo-box"
        style="
          position: absolute;
          width: 55px;
          height: 55px;
          top: 10px;
          left: 15px;
          border-bottom-right-radius: 60px;
          background: white;
        "
      ></div>
      <div
        class="logo"
        src="logo.png"
        style="
          position: absolute;
          top: 0px;
          width: 60px;
          height: 60px;
          border-bottom-right-radius: 60px;
          background: rgb(236, 128, 128);
        "
      >
        <img
          data-src="logo.png"
          alt="Logo"
          class="logo-img"
          style="max-width: 100%; max-height: 100%"
        />
      </div>
    </div>
  </body>
</html>
