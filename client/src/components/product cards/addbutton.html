<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Card</title>
  </head>
  <body>
    <!-- Usage example (not inside template) -->
    <!--<product-card store="PicknPay" data-id="p-001" name="Snack pack" price="15.00" sale="12.50" image="images/snack.png" logo-src="images/pnp-logo.png"></product-card> -->

    <template id="add-button-template">
      <style>
        /* Theme variables  */
        .add-button-component {
          --store-border: #d18286; /* default border */
          --image-bg: pink; /* default image background */
          --add-btn-bg: black; /* default add button color */
          --logo-bg: white; /* default logo background */
          --logo-text: #000; /* default logo text color */
        }

        /* Root container  */
        .add-button-component {
          position: absolute;
          left: 50px;
          top: 50px;
        }

        /* CSS Design */

        .box {
          width: 225px;
          height: 307px;
          background: white;
          border-style: solid;
          border-color: var(--store-border);
          border-radius: 20px;
          box-sizing: border-box;
        }
        .box2 {
          position: absolute;
          width: 205px;
          height: 195px;
          left: 15px;
          top: 20px;
          border-radius: 10px;
          background: var(--image-bg);
        }
        .Product-name {
          position: absolute;
          left: 15px;
          top: 225px;
          font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }
        .Product-price {
          position: absolute;
          left: 15px;
          top: 245px;
          font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
          font-size: 12px;
        }
        .Product-sale-price {
          position: absolute;
          left: 15px;
          top: 265px;
          font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
          font-size: 12px;
        }
        .box3 {
          position: absolute;
          width: 90px;
          height: 75px;
          background: white;
          left: 135px;
          top: 235px;
          border-style: solid;
          border-color: var(--store-border);
          border-radius: 20px;
          border-bottom-color: white;
          border-right-color: white;
          border-bottom-left-radius: 5px;
          border-top-right-radius: 5px;
          box-sizing: border-box;
        }
        .add-button {
          position: absolute;
          left: 150px;
          top: 245px;
          width: 70px;
          height: 70px;
          font-size: 36px;
          background: var(--add-btn-bg);
          border-bottom-right-radius: 30px;
          border-top-left-radius: 30px;
          border-top-right-radius: 30px;
          border-bottom-left-radius: 5px;
          color: white;
          border: none;
          cursor: pointer;
          padding: 0;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .box5 {
          position: absolute;
          width: 35px;
          height: 35px;
          top: 20px;
          left: 15px;
          border-bottom-right-radius: 35px;
          background: white;
        }
        .product-image {
          width: 95px;
          height: 95px;
          position: absolute;
          left: 73px;
          top: 75px;
        }
        .product-image .product-img {
          max-width: 100%;
          max-height: 100%;
          display: block;
        }
        .heart-button {
          position: absolute;
          background: none;
          border: none;
          cursor: pointer;
          padding: 0;
          width: 25px;
          height: 25px;
          top: 55px;
          left: 170px;
        }
        .heart-button img {
          width: 100%;
          height: 100%;
          border-color: white;
          display: block;
        }
        .logo-box {
          position: absolute;
          width: 55px;
          height: 55px;
          top: 10px;
          left: 15px;
          border-bottom-right-radius: 60px;
          background: white;
        }
        .logo {
          position: absolute;
          top: 0px;
          width: 60px;
          height: 60px;
          border-bottom-right-radius: 60px;
          background: var(--logo-bg);
          color: var(--logo-text);
          display: flex;
          align-items: center;
          justify-content: center;
          overflow: hidden;
        }
        .logo .logo-img {
          max-width: 100%;
          max-height: 100%;
          display: block;
        }
      </style>

      <div class="add-button-component">
        <div class="box"></div>
        <div class="box2"></div>
        <div class="Product-name" src="product-name">Product Name</div>
        <div class="Product-price" src="product-price">Price -</div>
        <div class="Product-sale-price" src="product-sale-price">Sale -</div>
        <div class="box3"></div>
        <button class="add-button" aria-label="Add to basket" type="button">
          +
        </button>
        <div class="box5"></div>
        <div class="product-image">
          <img
            src=""
            data-src="product-image.jpg"
            alt="Product image"
            class="product-img"
          />
        </div>
        <button
          class="heart-button"
          aria-label="Add to favourites"
          type="button"
        >
          <img src="heart-angle-svgrepo-com.svg" alt="heart" />
        </button>
        <div class="logo-box"></div>
        <div class="logo" src="logo.png">
          <img src="" data-src="logo.png" alt="Logo" class="logo-img" />
        </div>
      </div>
    </template>
    <script type="module" src="./product-card.js"></script>
  </body>
</html>
