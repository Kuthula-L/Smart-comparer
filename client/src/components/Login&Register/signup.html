<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Price Comparer</title>
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <!-- Logo and Header -->
            <img class="logo" src="/icons/Logo.jpg" alt="Logo">
            <h1 class="auth-subtitle">Smart comparer</h1>
            <p class="app-description">We compare prices across trusted stores</p>
            
            <!-- Google Button -->
            <button class="btn-google" id="google-signup">
                <img class="google-icon" src="https://static.vecteezy.com/system/resources/previews/011/598/471/original/google-logo-icon-illustration-free-vector.jpg" alt="Google">
                Continue with Google
            </button>
            
            <!-- OR Divider -->
            <div class="divider">
                <div class="divider-line"></div>
                <span class="divider-text">or</span>
                <div class="divider-line"></div>
            </div>
            
            <!-- Signup Form -->
           <form id="signup-form" class="auth-form">
                <input id="signup-email" type="email" placeholder="Enter Email" class="form-input" required>
                <input id="signup-password" type="password" placeholder="Enter Password" class="form-input" required>
                <input id="signup-confirm" type="password" placeholder="Confirm Password" class="form-input" required>
                <button type="submit" class="btn-primary">Create Account</button>
            </form>

            
            <!-- Auth Switch -->
            <div class="auth-switch">
                <span>Already have an account? </span>
                <a href="login.html">Login</a>
            </div>
        </div>
    </div>
<script>
        document.addEventListener("DOMContentLoaded", () => {
            const form = document.getElementById("signup-form");
            if (!form) return;

            form.addEventListener("submit", (e) => {
                e.preventDefault();

                const email = document.getElementById("signup-email").value.trim();
                const password = document.getElementById("signup-password").value;
                const confirm = document.getElementById("signup-confirm").value;

                if (!email || !password) {
                    alert("Please enter email and password.");
                    return;
                }
                if (password !== confirm) {
                    alert("Passwords do not match.");
                    return;
                }

                const users = JSON.parse(localStorage.getItem("users") || "[]");
                if (users.find(u => u.email === email)) {
                    alert("An account with this email already exists. Try logging in.");
                    return;
                }

                const newUser = { email, password };
                users.push(newUser);
                localStorage.setItem("users", JSON.stringify(users));
                localStorage.setItem("loggedInUser", JSON.stringify(newUser));

                alert("Account created successfully! Redirecting to Home Page...");

                // redirect to HomePage.html
                window.location.href = "/src/pages/Home/HomePage.html";
            });
        });
    </script>

    <script src="auth.js"></script>
    
</body>
</html>
