<template id="filter-popup-template">
  <style>
    :host { 
      position: relative; 
      display: inline-block; 
      font-family: Inter, system-ui, sans-serif; 
    }

    .filter-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 20px;
      border: 1px solid #e6e6e6;
      background: #fff;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
    }

    .popup {
      position: absolute;
      top: 44px;
      left: 0;
      min-width: 260px;
      background: #fff;
      border-radius: 22px;
      border: 1px solid #f0f0f0;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
      padding: 20px;
      display: none;
      flex-direction: column;
      gap: 12px;
      z-index: 1000;
    }

    .popup.show { display: flex; }

    .filter-options {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px 20px; 
      justify-items: start;
      margin-bottom: 20px;
    }

    label {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      cursor: pointer;
    }

    input[type="checkbox"] {
      width: 16px;
      height: 16px;
      border: 2px solid #f7c210;
      accent-color: #f7c210;
      transform: scale(1.3);
      cursor: pointer;
    }

    .confirm-btn {
      background: #f7c210;
      border: none;
      padding: 10px 28px;
      border-radius: 27.5px 27.5px 0px 0px;
      font-weight: bold;
      cursor: pointer;
      align-self: center;
      margin-top: 10px;
    }

    .filter-logo {
      width: 16px;   
      height: 16px;
    }
  </style>

  <button class="filter-btn">
    <img src="https://www.svgrepo.com/show/533558/filter.svg" alt="filter icon" class="filter-logo">
    
  </button>

  <div class="popup">
    <div class="filter-options">
      <label><input type="checkbox" name="filter" value="Shoprite"> Shoprite</label>
      <label><input type="checkbox" name="filter" value="Checkers"> Checkers</label>
      <label><input type="checkbox" name="filter" value="Pick n Pay"> Pick n Pay</label>
      <label><input type="checkbox" name="filter" value="Woolworths"> Woolworths</label>
      <label><input type="checkbox" name="filter" value="Boxer"> Boxer</label>
      <label><input type="checkbox" name="filter" value="Spar"> Spar</label>
    </div>

    <button class="confirm-btn">confirm</button>
  </div>
</template>
