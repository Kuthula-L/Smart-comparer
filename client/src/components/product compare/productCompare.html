<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <template id="CompareProductComponent">
      <style>
        /* Campare button */
        .CompareButton {
          position: absolute;
          background-color: hwb(46 1% 1%);
          color: black;
          border: 1px solid #dfd5ae;
          height: 45px;
          width: 109px;
          border-radius: 10px;
          border-bottom-left-radius: 30px;
          border-top-left-radius: 20px;
          cursor: pointer;
          font-family: Arial, Helvetica, sans-serif;
        }
        /* container for the image */
        .image-container {
          position: absolute;
          width: 190px;
          margin-left: 7px;
          margin-top: 7px;
          height: 195px;
          background-color: #f6f3ce;
          border-radius: 10px;
        }
        /* This is for heart icon for favourites */
        .favourites {
          position: absolute;
          top: 12px;
          right: 15px;
          font-size: 37px;
          color: #ffffff; /* first color white*/
          width: 25px;
          height: 30px;
          display: flex;
          justify-content: center;
          align-items: center;
          cursor: pointer;
        }
        .favourites.active {
          color: hwb(46 1% 1%);
        }
        .product-card {
          width: 205px;
          height: 300px;
          background: white;
          border-color: #f2ec9b;
          border-style: solid;
          border-radius: 10px; /*rounded corners*/
        }
        .title {
          position: absolute;
          left: 15px;
          top: 225px;
          font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
          font-size: 12px;
          font-weight: bold;
        }
        /* This is for "AVG. Price" lavel */
        .avgprice {
          position: absolute;
          left: 15px;
          top: 245px;
          font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
          font-size: 12px;
        }
        .price {
          position: absolute;
          left: 15px;
          top: 265px;
          font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
          font-size: 12px;
          font-weight: bold;
        }
        .product-card img {
          width: 100%;
          height: 180px;
          object-fit: cover;
        }
        .containerCurve {
          position: absolute;
          width: 45px;
          height: 35px;
          top: 20px;
          left: 15px;
          border-bottom-right-radius: 35px;
          background: white;
        }
      </style>
      <div class="product-card">
        <div class="image-container">
          <img src="download.png" alt="product not found" />
          <div class="favourites" id="heart">
            <img
              src="whiteHeart.svg"
              style="
                position: absolute;
                width: 35px;
                height: 35px;
                margin-top: 0px;
                margin-left: 2px;
              "
              alt="Favourites"
            />
            <div class="favourites.active"></div>
          </div>
        </div>
        <div class="product-info">
          <!-- Product text details -->
          <div class="title">Product-</div>
          <div class="avgprice">AVG. Price</div>
          <div class="price"></div>
        </div>
      </div>
      <div>
        <!-- put a link that a compare button is going to be directed to  -->
        <a href="">
          <button
            class="CompareButton"
            style="position: absolute; left: 110px; top: 270px; z-index: 3"
          >
            Compare
          </button>
        </a>
      </div>
      <div
        class="box"
        style="
          position: absolute;
          top: 259px;
          left: 103px;
          width: 110px;
          height: 50px;
          border-style: solid;
          border-color: #f2ec9b;
          border-top-left-radius: 20px;
          border-bottom-color: white;
          border-right-color: white;
          background: white;
          z-index: 1;
        "
      ></div>
    </template>
    <script type="module" src="./productCompare.js"></script>
  </body>
</html>
