<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <template id="CompareProductComponent">
      <style>
        /* Product card container */
        .product-card {
          width: 160px;
          height: 245px;
          background: white;
          border: 1px solid #f2ec9b;
          border-radius: 10px;
          font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 20px;
          /*justify-content: space-between;*/
          padding: 10px;
          box-sizing: border-box;
          position: relative; /* needed only for the compare button overlay */
        }

        /* Image container */
        .image-container {
          width: 100%;
          height: 180px;
          background-color: #f6f3ce;
          border-radius: 10px;
          overflow: hidden;
          display: flex;
          justify-content: center;
          align-items: center;
          position: relative; /* needed for heart icon */
        }

        .image-container img {
          width: 70%;
          height: 70%;
          object-fit: cover;
          border-radius: 10px;
        }

        /* Heart (favourite) icon */
        .favourites {
          position: absolute;
          top: 10px;
          right: 10px;
          cursor: pointer;
          width: 30px;
          height: 30px;
        }

        .favourites img {
          width: 100%;
          height: 100%;
        }

        .favourites.active img {
          filter: invert(77%) sepia(55%) saturate(671%) hue-rotate(12deg)
            brightness(97%) contrast(93%);
        }

        /* Text info */
        .product-info {
          width: 100%;
          display: flex;
          flex-direction: column;
          gap: 4px;
        }

        .title {
          font-size: 12px;
          font-weight: bold;
        }

        .avgprice {
          font-size: 12px;
          color: #444;
        }

        .price {
          font-size: 12px;
          font-weight: bold;
        }

        /* The compare button area — only absolute container */
        .compare-container {
          position: absolute;
          bottom: 0px;
          right: 0px;
          display: flex;
          align-items: center;
          justify-content: center;
        }

        .CompareButton {
          background-color: hwb(46 1% 1%);
          color: black;
          border: 1px solid #dfd5ae;
          height: 40px;
          width: 80px;
          border-radius: 10px;
          cursor: pointer;
          font-size: 13px;
          font-family: Arial, Helvetica, sans-serif;
          z-index: 10;
        }

        /* Optional curved box background */
        .box {
          position: absolute;
          bottom: -1px;
          right: -1px;
          width: 90px;
          height: 50px;
          /* border: 1px solid #f2ec9b;*/
          border-left: 1px solid #f2ec9b ;
          border-top: 1px solid #f2ec9b ;

          border-top-left-radius: 20px;
          background: white;
          z-index: 3;
        }
      </style>

      <div style="z-index: 2;" class="product-card">
        <div class="image-container">
          <img src="/download.png" alt="product not found" />
          <div class="favourites" id="heart">
            <img src="/whiteHeart.svg" alt="Favourites" />
          </div>
        </div>

        <div class="product-info">
          <div class="title">Product-</div>
          <div class="avgprice">AVG. Price</div>
          <div class="price">R00.00</div>
        </div>

        <!-- Absolute compare button -->
        <div class="compare-container">
          <!-- <a href="#"> -->
            <button class="CompareButton">Compare</button>
          <!-- </a> -->
        </div>

        <div class="box"></div>
      </div>
    </template>

    <script type="module" src="./productCompare.js"></script>
  </body>
</html>
