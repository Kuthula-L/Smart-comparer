<template id="search-bar-template">
  <style>
    :host {
      all: initial;
      display: block;
      font-family: sans-serif;
    }

    /* Search bar container */
    .search-container {
      display: flex;
      justify-content: center;
      position: fixed;
      top: 100px;
      left: 0;
      width: 100%;
      z-index: 101;
    }

    .search-bar {
      border: 2px solid #F2EC9B;
      border-radius: 25px;
      box-shadow: 2px 2px ;
      width: 300px;
      height: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px 35px 10px 15px;
      font-size: 16px;
      color: black;
      background: white;
    }

    .search-icon img {
      width: 20px;
      height: 20px;
    }

    input {
      border: none;
      outline: none;
      flex: 1;
      height: 100%;
      font-size: 17px;
      color: #999999;
      background: transparent;
      padding-left: 8px;
    }

    .clear-icon {
      width: 17px;
      height: 22px;
      color: #999999;
      cursor: pointer;
      display: none;
    }

     .results-container {
      position: fixed;
      top: 150px;
      left: 50%;
      transform: translateX(-50%);
      width: 90vw;
      max-width: 1050px;
      max-height: 75vh;
      overflow-x:auto;
      overflow-y: auto;
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      padding: 15px;
      border-radius: 10px;
      z-index: 100;
    }


    /* Product card */
    .product-card {
      width: 205px;
      height: 300px;
      background: white;
      border-color: #f2ec9b;
      border-style: solid;
      border-radius: 10px;
      position: relative;
    }

    .product-card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-top-left-radius: 10px;
      border-top-right-radius: 10px;
    }
    

    .title {
      position: absolute;
      left: 15px;
      top: 185px;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      font-size: 12px;
      font-weight: bold;
    }

    .avgprice {
      position: absolute;
      left: 15px;
      top: 205px;
      font-size: 12px;
    }

    .price {
      position: absolute;
      left: 15px;
      top: 225px;
      font-size: 12px;
      font-weight: bold;
    }

    .favourites {
      position: absolute;
      top: 12px;
      right: 15px;
      font-size: 25px;
      color: #ffffff;
      cursor: pointer;
      z-index: 2;
    }

    .favourites.active {
      color: hwb(46 1% 1%);
    }

    .CompareButton {
      position: absolute;
      bottom: 10px;
      right: 10px;
      background-color: hwb(46 1% 1%);
      color: black;
      border: 1px solid #dfd5ae;
      height: 35px;
      width: 90px;
      border-radius: 10px;
      border-bottom-left-radius: 30px;
      border-top-left-radius: 20px;
      cursor: pointer;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 12px;
    }
  </style>

  <div class="search-container">
    <div class="search-bar">
      <span class="search-icon"><img src="/search-svgrepo-com.svg" alt="Search" /></span>
      <input type="text" placeholder="Search..." />
      <span class="clear-icon">✖</span>
    </div>
  </div>

  <div class="results-container"></div>
</template>
