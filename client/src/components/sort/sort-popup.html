<template id="sort-popup-template">
  <style>
    :host { position: relative; display: inline-block; font-family: Inter, system-ui, sans-serif; }

    .sort-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 20px;
      border: 1px solid #e6e6e6;
      background: #fff;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
    }

    .popup {
      position: absolute;
      top: 44px;
      left: 0;
      min-width: 260px;
      background: #fff;
      border-radius: 22px;
      border: 1px solid #f0f0f0;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
      padding: 20px;
      display: none;
      flex-direction: column;
      gap: 12px;
      z-index: 1000;
    }

    .popup.show { display: flex; }

    .sort-options {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px 20px; /* space between items */
      justify-items: start;
      margin-bottom: 20px;
}

    label {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      cursor: pointer;
    }
    input[type="checkbox"]{
      width: 16px;
      height:16px;
      border:2px solid #f7c210;
      accent-color: #f7c210;
      transform: scale(1.3);
      cursor:pointer;
    }
    

    .confirm-btn {
      background: #f7c210;
      border: none;
      padding: 10px 28px;
      border-radius: 27.5px 27.5px 0px 0px;
      font-weight: bold;
      cursor: pointer;
      align-self: center;
      margin-top: 10px;
    }

    .row{
      display:flex;
      padding:10px;
      margin-bottom: 15px;
      align-items:left;
      justify-content: left;
      gap:10px;
      width:100%;
    }

.sort-toggle {
  display: flex;
  align-items: center;
  gap: 6px; 
  background-color: white;
  border: 1px solid #ddd;
  border-radius: 20px;
  padding: 5px 12px;
  cursor: pointer;
}

.sort-logo {
  width: 16px;   
  height: 16px;
}

  </style>

  <button class="sort-btn">
    <img src="https://www.svgrepo.com/show/523782/sort-vertical.svg" alt="sort icon" class="sort-logo"> 
     </button>

  <div class="popup">

    <div class="row">
      <label><input type="checkbox" name="sort" value="best"> Best match</label>
      <label><input type="checkbox" name="sort" value="low"> Price : low to high</label>
    </div>
    <div class="row">
    <label><input type="checkbox" name="sort" value="high"> Price : high to low</label>
      </div>
    <button class="confirm-btn">confirm</button>
    
  </div>

</template>
