<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Landing Page</title>
  </head>
  <body style="margin: 0; font-family: Arial, sans-serif; color: #333">
    <style>
      .landing-page-compare-button{
        position: absolute;
        left: 10px;
        top: 265px;
        font-size: 14px;
        font-weight: bold;
        color: #333;
        background: linear-gradient(90deg, #E5A000, #F6B000);
        border: none;
        padding: 10px 16px;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.3s ease;
        z-index: 1;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        width: fit-content;
        white-space: nowrap;
        box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        text-decoration: none; /* remove underline */
      }
      .landing-page-compare-button:focus { outline: 3px solid rgba(0,0,0,0.12); }
    </style>
    <header
      style="
        background-color: white;
        padding: 10px 20px;
        text-align: center;
      "
    >
      <img src="/smart compare 1.svg" alt="logo" style="height: 50px; width: 50px; left: 10px; position: absolute;" />
    </header>

    <img src="/Group 32.svg" alt="hero" style="position: absolute;left: 20px; top:650px; width: 361; height:228" />
    <img src="/cuate.svg" alt="hero" style="position: absolute;left: 200px; top:80px; width: 361; height:228" />
    <img src="/Group 53.svg" alt="hero" style="position: absolute;left: 50px; top:350px; width: 361; height:228" />
    <div class="quote" style="position:absolute;font-size: 24px;left: 35px;top:95px; font-weight: bold;">
    <div>Find it.</div>
    <div>Compare it.</div>
    <div>Save Big.</div>
    <div>Smarter</div>
    <div>shopping</div>
    <div>starts here!</div>
    </div>
    <div class="quote2" style="position:absolute;font-size: 20px;left: 35px;top:315px; font-weight: bold;">
    <div>Ready to start saving?here's how it</div>
    <div>works</div>
    </div>
    <div class="quote3" style="position:absolute;font-size: 20px;left: 35px;top:580px; font-weight: bold;">
    <div style="font-weight: bold;">Featured Shops</div>
    <div style="font-style:italic">We compare prices across trusted stores</div>
    </div> 
    <a href="../../components/Login%26Register/signup.html" 
      class="landing-page-compare-button"
      role="button"
      aria-label="Compare Prices and sign up">
      <i class="fas fa-chart-bar" aria-hidden="true"></i>
      Compare Prices Now
    </a>
    <section
      style="
        padding: 20px;
        text-align: center;
        background-color: #f9f9f9;
        margin: 20px;
        border-radius: 8px;
      "
    >

    <footer
      style="
        background-color:white;
        color: white;
        text-align: center;
        padding: 10px 0;
        position: fixed;
        width: 100%;
        left: 0px;
        top: 869px;
      "
    >
     <img src="/Group 29.svg" alt="hero" style="width: 100%;height:auto" />
    </footer>

</html>
